
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

proxy_cache_path /var/cache/nginx
                 levels=1:2
                 keys_zone=my_cache:10m
                 max_size=1g
                 inactive=60m
                 use_temp_path=off;

server {
    listen 80;
    server_name myfinance.gustavosdaniel.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name myfinance.gustavosdaniel.com;

    ssl_certificate /etc/letsencrypt/live/myfinance.gustavosdaniel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myfinance.gustavosdaniel.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss;
    gzip_min_length 1024;
    gzip_comp_level 5;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;

    location / {

        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://my-finance-app:5050;

        proxy_cache my_cache;
        proxy_cache_valid 200 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_methods GET HEAD;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}