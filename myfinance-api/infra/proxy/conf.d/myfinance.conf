limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

proxy_cache_path /var/cache/nginx
                 levels=1:2
                 keys_zone=my_cache:10m
                 max_size=1g
                 inactive=60m
                 use_temp_path=off;

server {
    listen 80;
    server_name myfinance.gustavosdaniel.com localhost; # Adicionado localhost para o healthcheck interno


    location /health {
        access_log off;
        add_header 'Content-Type' 'text/plain';
        return 200 'OK';
    }


    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name myfinance.gustavosdaniel.com;

    ssl_certificate     /etc/letsencrypt/live/myfinance.gustavosdaniel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myfinance.gustavosdaniel.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout    5s;

    gzip            on;
    gzip_vary       on;
    gzip_types      text/plain text/css application/json application/javascript application/xml+rss;
    gzip_min_length 1024;
    gzip_comp_level 5;

    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options            SAMEORIGIN                            always;
    add_header X-Content-Type-Options     nosniff                               always;
    add_header X-XSS-Protection           "1; mode=block"                       always;
    add_header Referrer-Policy            strict-origin-when-cross-origin       always;

    # ── Actuator bloqueado externamente ────────────────────────────────────────
    location /actuator/ {
        deny all;
        return 403;
    }

    # ── App ────────────────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://10.0.0.10:5050;

        proxy_no_cache     1;
        proxy_cache_bypass 1;
        add_header X-Cache-Status "DISABLED";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Keycloak ───────────────────────────────────────────────────────────────
    location /auth/ {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://10.0.0.10:5053;

        proxy_no_cache     1;
        proxy_cache_bypass 1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_buffer_size       128k;
        proxy_buffers           4 256k;
        proxy_busy_buffers_size 256k;
    }
}