services:
  my-finance-app:
    ports:
      - "5050:5050"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATA_REDIS_HOST: dragonfly
      SPRING_DATA_REDIS_PORT: 6379
      CLIENT_ID: ${CLIENT_ID}
      CLIENT_SECRET: ${CLIENT_SECRET}
      ADMIN_EMAILS: ${ADMIN_EMAILS}

  postgres:
    ports:
      - "5051:5432"

  dragonfly:
    ports:
      - "5052:6379"

  dbeaver:
    image: dbeaver/cloudbeaver:ea
    container_name: cloudbeaver-my-finance
    restart: unless-stopped
    ports:
      - "5053:8978"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    networks:
      - myfinance-network
    depends_on:
      - postgres

volumes:
  cloudbeaver_data: